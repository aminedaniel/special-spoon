# Signal category weights for the composite score. Must sum to 1.0.
#
# FOUR signals, equal weight. This is a deliberate simplification, made after a
# 54-period walk-forward found every measurable signal indistinguishable from
# zero and the screen showing no alpha against its correct benchmark (IWM,
# beta 0.99). See reports/backtests/COMPARISON.md.
#
# Why fewer rather than a higher significance bar: twelve signals tested at
# t > 2 carries roughly a 46% chance of a false positive by luck alone. Harvey,
# Liu & Zhu argue for t > 3.0 precisely because of this. Cutting the count is
# the honest response; raising the bar on twelve knobs the data cannot support
# is not.
#
# SELECTED ON REPLICATION RECORD, NOT ON OUR MEASURED ICs. earnings_drift
# measured -0.016 here, second-worst of the set, and is kept anyway. Choosing
# signals by their in-sample IC is exactly the overfitting this simplification
# exists to avoid, and there is not enough data here to distinguish skill from
# luck at that resolution.
#
# NO weight here is validated on this universe. Of the four, only three can even
# be backtested: profitability comes from yfinance snapshots, so it stays out of
# the walk-forward and rests on published evidence alone.
#
# Positions are intended to be held a QUARTER. The weekly report is a monitor
# that refreshes facts, not a rebalance trigger — rebalancing monthly on
# quarterly-updating inputs was most of the 39% turnover and 6.6% cost drag the
# cost model found, bought for no new information.
weights:
  technical: 0.25        # 12-1 momentum. Jegadeesh-Titman 1993; confirmed
                         # out-of-sample, internationally and cross-asset
                         # (Asness/Moskowitz/Pedersen 2013). Strongest survivor.
  profitability: 0.25    # GP/assets (Novy-Marx 2013) + asset growth
                         # (Cooper/Gulen/Schill 2008). Both became FF5 factors
                         # (RMW, CMA). NOT backtestable here — snapshot data.
  issuance: 0.25         # net share issuance (Pontiff-Woodgate 2008,
                         # Daniel-Titman 2006). Survived Hou/Xue/Zhang 2020
                         # best of the categories they re-tested.
  earnings_drift: 0.25   # PEAD/SUE (Ball-Brown 1968, Bernard-Thomas 1989).
                         # Among the most robust anomalies documented.

# Computed and REPORTED, but not scored. These are the checkable facts this tool
# produces well — insider buying, activist stakes, share-count moves, filing
# language shifts — and the weekly report leads with them. They are unscored
# because each fires on only a small subset of these names (insider buying
# reached ~2 of 63 in a 90-day window), or because the anomaly has decayed
# (accruals: Green/Hand/Soliman 2011), or because snapshot-only data makes them
# unbacktestable (short_interest):
#   insider, events, filing_text, fundamentals, quality, valuation,
#   short_interest, stability
# composite_score gives any category absent from `weights` a weight of 0.0 while
# still emitting its score_<name> column, so nothing needs deleting to unscore.

# Quality gate applied to the universe before scoring.
thresholds:
  min_market_cap: 300000000      # $300M — small-cap floor
  max_market_cap: 20000000000    # $20B — mid-cap ceiling
  max_pe: 60                     # ignore extreme-multiple names (null P/E allowed)

report:
  top_n: 20                      # picks shown in the weekly report
  stage_a_shortlist_size: 100    # names advanced to Stage B (EDGAR fetch)
