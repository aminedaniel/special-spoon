# Signal category weights for the composite score. Must sum to 1.0.
#
# NO weight here is set by measurement. The 53-period walk-forward run over
# 2022-07 -> 2026-07 found every backtestable signal statistically
# indistinguishable from zero (best: technical +0.013, t=0.47). An earlier
# 27-period run appeared to show insider at +0.068 (t=1.96); that was an
# artifact of a Form 4 fetch cap too small for the window, and it vanished
# once coverage was fixed. See reports/backtests/COMPARISON.md.
#
# So these rest on published evidence and judgement, which is the honest
# basis available. Do not treat any of them as validated on this universe.
weights:
  insider: 0.13          # insider buying: strong literature, unvalidated here (measured +0.000 over 53 periods)
  fundamentals: 0.12     # growth + balance-sheet quality (valuation moved out)
  earnings_drift: 0.11   # PEAD/SUE; measured flat, but on only ~20 scored names/period
  technical: 0.09        # 12-1 momentum; best of a weak field (+0.013, t=0.47) but not significant
  quality: 0.08          # accruals gap + share-count dilution
  events: 0.08           # 13D stakes, shelves, 8-K red flags; measured ~0.000 over 53 periods
  filing_text: 0.08      # 10-Q/10-K language stability ("lazy prices")
  profitability: 0.08    # GP/assets (Novy-Marx) + asset growth (CMA) — best-replicated factors
  short_interest: 0.07   # high/rising short interest predicts negative returns
  valuation: 0.06        # cheapness predicts poorly in tech
  trends: 0.05           # Google Trends search-interest momentum (unproven; small)
  stability: 0.05        # low beta/idio-vol. Regime-dependent exactly as theory predicts:
                         # IC +0.029 in the 2022-24 bear/recovery half, -0.076 in the
                         # 2024-26 momentum half, ~-0.022 over the full 53 periods. Held
                         # small as drawdown insurance, not as an alpha source.

# Quality gate applied to the universe before scoring.
thresholds:
  min_market_cap: 300000000      # $300M — small-cap floor
  max_market_cap: 20000000000    # $20B — mid-cap ceiling
  max_pe: 60                     # ignore extreme-multiple names (null P/E allowed)

report:
  top_n: 20                      # picks shown in the weekly report
  stage_a_shortlist_size: 100    # names advanced to Stage B (EDGAR fetch)
