# Signal category weights for the composite score. Must sum to 1.0.
#
# Weights marked "(backtest IC)" were set by the 27-period walk-forward run
# over 2024-07-01 -> 2026-07-29, which grades signals on non-overlapping
# forward returns. Everything else rests on published evidence only, because
# free sources serve those signals as current snapshots and backtesting them
# with today's data would be lookahead.
weights:
  insider: 0.18          # (backtest IC) best measured signal: +0.068, t=1.96, 67% of periods positive
  fundamentals: 0.11     # growth + balance-sheet quality (valuation moved out)
  earnings_drift: 0.11   # PEAD/SUE; measured flat (+0.001) but on ~20 scored names/period — held, not cut
  technical: 0.09        # (backtest IC) +0.029, t=0.61 — weak but the right sign
  quality: 0.08          # accruals gap + share-count dilution
  events: 0.08           # (backtest IC) ~0.000; shelf/timing fixes are newer than the measurement
  filing_text: 0.08      # 10-Q/10-K language stability ("lazy prices")
  profitability: 0.07    # GP/assets (Novy-Marx) + asset growth (CMA) — best-replicated factors
  short_interest: 0.07   # high/rising short interest predicts negative returns
  valuation: 0.06        # cheapness predicts poorly in tech
  trends: 0.05           # Google Trends search-interest momentum (unproven; small)
  stability: 0.02        # (backtest IC) MEASURED NEGATIVE: -0.077, t=-1.49. Floored, not
                         # removed — one momentum-led regime is not proof the low-risk
                         # anomaly is absent, and a zero weight can never earn its way back.

# Quality gate applied to the universe before scoring.
thresholds:
  min_market_cap: 300000000      # $300M — small-cap floor
  max_market_cap: 20000000000    # $20B — mid-cap ceiling
  max_pe: 60                     # ignore extreme-multiple names (null P/E allowed)

report:
  top_n: 20                      # picks shown in the weekly report
  stage_a_shortlist_size: 100    # names advanced to Stage B (EDGAR fetch)
