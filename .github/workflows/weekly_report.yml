name: Weekly stock report

on:
  schedule:
    # Monday 05:37 UTC (overnight, before US market open). The paired delivery
    # Routine fires at 16:00 UTC, so this start gives ~10.4h of slack for GitHub
    # to run the queued job before delivery reads the committed report.
    #
    # Why so early: GitHub cron is best-effort and can queue for hours. On
    # 2026-08-31 an 11:37 start was delayed to 18:07 — PAST the 16:00 delivery,
    # so that week's deep dive found only the prior week's report and was
    # skipped. 05:37 absorbs a delay of that size (6.5h -> 12:07) and then some.
    # A weekly screen only needs Friday's close, which is fixed all weekend, so
    # computing it overnight rather than pre-market changes no data.
    # Off-peak minute (:37, not :00) avoids the top-of-hour scheduling surge.
    - cron: "37 5 * * 1"
  workflow_dispatch:
    inputs:
      backfill_tracker:
        description: "One-time: seed the recommendation tracker from all past reports (historical closes)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python run_weekly_report.py --output-dir reports
      - name: Update scoreboard
        run: python run_scoreboard.py --reports-dir reports
      - name: Backfill recommendation tracker (manual, one-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_tracker }}
        run: python run_tracker.py --reports-dir reports --top-n 1 --backfill
      - name: Update recommendation tracker
        if: ${{ github.event_name == 'schedule' }}
        run: python run_tracker.py --reports-dir reports --top-n 1
      - name: Commit report
        # Rebase-and-retry rather than a bare push. Observed 2026-09-16: the
        # report generated fine, then `git push` was rejected ("fetch first")
        # because main had moved while the job ran, and the whole week's report
        # was lost with it. A weekly job that takes ~5 minutes will eventually
        # overlap a merge; losing the report to that is avoidable.
        #
        # Only reports/ is ever touched here and nothing else writes to it, so
        # a rebase cannot conflict in practice — but --autostash and the retry
        # loop mean a surprise still costs a retry instead of the report.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Weekly report $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 2))
          done
          echo "::error::could not push the report after 5 attempts"
          exit 1
