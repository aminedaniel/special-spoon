name: Daily stock report

on:
  schedule:
    # Weekdays 11:37 UTC (7:37am ET, pre-market). Off-peak minute: GitHub queues
    # top-of-hour schedules and can delay them by hours. Markets are closed
    # weekends, so no run Sat/Sun. Delivery Routines fire at 16:00 UTC to allow
    # for remaining schedule delay.
    - cron: "37 11 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_tracker:
        description: "One-time: seed the recommendation tracker from all past reports (historical closes)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python run_weekly_report.py --output-dir reports
      - name: Update scoreboard
        run: python run_scoreboard.py --reports-dir reports
      - name: Backfill recommendation tracker (manual, one-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_tracker }}
        run: python run_tracker.py --reports-dir reports --top-n 2 --backfill
      - name: Update recommendation tracker (Mondays)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python run_tracker.py --reports-dir reports --top-n 2
          else
            echo "Not Monday — skipping weekly tracker update."
          fi
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Daily report $(date -u +%F)"
          git push
