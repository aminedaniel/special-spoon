name: Diagnose Google Trends

# Manual only. Prints what Google Trends actually returns to a GitHub runner:
# pytrends version, exact exception type, and HTTP status. The weekly report
# has claimed "likely rate-limited" for weeks without that ever being checked.
# Writes nothing to the repo.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Google Trends
        run: python scripts/diagnose_trends.py
